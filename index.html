 <!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Roblox Studio Mobile</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: row;
      background: #1e1e1e;
      color: white;
    }
    #menu {
      width: 200px;
      background: #2d2d2d;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }
    #editor {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    #scene {
      flex: 2;
    }
    button {
      margin: 5px 0;
      padding: 10px;
      background: #3a3a3a;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <div id="menu">
    <h3>Меню</h3>
    <button onclick="getCreations()">Creations</button>
    <button onclick="createGame()">Create Game</button>
    <button onclick="updateGame()">Update Game</button>
    <button onclick="saveAsset()">Save Asset</button>
    <button onclick="deleteAsset()">Delete Asset</button>
    <button onclick="publishGame()">Publish Game</button>
    <button onclick="goFullscreen()">Full Screen</button>
  </div>

  <div id="editor">
    <h3>Редактор коду</h3>
    <textarea style="flex:1; width:100%; background:#111; color:#0f0;"></textarea>
  </div>

  <canvas id="scene"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function goFullscreen() {
  document.documentElement.requestFullscreen();
}

// 3D сцена
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({canvas: document.getElementById("scene")});
renderer.setSize(window.innerWidth, window.innerHeight);

const geometry = new THREE.BoxGeometry();
const material = new THREE.MeshBasicMaterial({color: 0x00ff00});
const cube = new THREE.Mesh(geometry, material);
scene.add(cube);

camera.position.z = 5;

function animate() {
  requestAnimationFrame(animate);
  cube.rotation.x += 0.01;
  cube.rotation.y += 0.01;
  renderer.render(scene, camera);
}
animate();

// Заглушки для API
function getCreations(){ alert("Creations API"); }
function createGame(){ alert("Create Game API"); }
function updateGame(){ alert("Update Game API"); }
function saveAsset(){ alert("Save Asset API"); }
function deleteAsset(){ alert("Delete Asset API"); }
function publishGame(){ alert("Publish Game API"); }
</script>
</body>
</html>
